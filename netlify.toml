[build]
  command = "pnpm build"
  publish = "out"

# Кеш: HTML всегда перепроверяется (старая/сломанная версия не залипает на Wi-Fi и в прокси),
# файлы с хешем в имени — навсегда, фото без хеша — с перепроверкой.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
